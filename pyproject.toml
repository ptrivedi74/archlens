[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archlens"
version = "0.1.0"
description = "MCP server for AI-assisted architecture governance: ADRs and domain rule-pack design reviews"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
archlens = "archlens.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
archlens = ["rules/*.yaml"]
